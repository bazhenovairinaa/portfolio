<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bazhenova Irina — Multidisciplinary Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-drag: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #FFFFFF;
            color: #111111;
        }

        /* --- HEADER --- */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 40px 60px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
            pointer-events: none;
        }

        .header-left {
            pointer-events: auto;
        }

        .header-title {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: -0.5px;
            color: #111111;
            text-decoration: none;
            display: inline-block;
        }

        .header-right {
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }

        .header-subtitle {
            font-size: 24px;
            font-weight: 400;
            letter-spacing: -0.5px;
            color: #111111;
            text-decoration: none;
        }

        /* --- LANGUAGE SWITCHER --- */
        .lang-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            letter-spacing: -0.2px;
        }

        .lang-btn {
            background: none;
            border: none;
            padding: 0;
            font-family: inherit;
            font-size: 14px;
            color: #888888;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .lang-btn:hover {
            color: #111111;
        }

        .lang-btn.active {
            color: #111111;
            font-weight: 500;
        }

        .lang-divider {
            color: #CCCCCC;
            font-size: 12px;
            user-select: none;
        }

        /* --- 3D SCENE --- */
        .scene-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1500px;
            perspective-origin: 50% 50%;
            cursor: grab;
            overflow: hidden;
            z-index: 1;
        }

        .scene-container:active {
            cursor: grabbing;
        }

        .carousel-3d {
            width: 300px;
            height: 400px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .carousel-item {
            position: absolute;
            left: 50%;
            top: 50%;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: transparent;
        }

        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            pointer-events: none;
        }

        .carousel-item.transparent-png img {
            object-fit: contain;
        }

        .drag-instruction {
            position: absolute;
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            opacity: 0.3;
            pointer-events: none;
            z-index: 5;
            text-align: center;
            transition: opacity 0.5s ease, transform 0.1s ease-out;
        }

        /* --- FOOTER --- */
        footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 50px 60px;
            display: flex;
            justify-content: center;
            gap: 60px;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .footer-link {
            font-size: 16px;
            font-weight: 400;
            color: #111111;
            text-decoration: none;
            letter-spacing: -0.2px;
            position: relative;
            padding-bottom: 2px;
            opacity: 0.9;
            transition: opacity 0.3s ease;
            pointer-events: auto;
        }

        .footer-link:hover {
            opacity: 1;
        }

        .footer-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 1px;
            background-color: #111111;
            transition: width 0.3s ease;
        }

        .footer-link:hover::after {
            width: 100%;
        }

        @media (max-width: 768px) {
            header {
                padding: 24px;
            }
            .header-title, .header-subtitle {
                font-size: 18px;
            }
            footer {
                padding: 30px 24px;
                gap: 30px;
            }
            .footer-link {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html" class="header-title lang" data-en="Bazhenova Irina" data-ru="Баженова Ирина">Bazhenova Irina</a>
        </div>
        <div class="header-right">
            <div class="header-subtitle lang" data-en="Multidisciplinary Designer" data-ru="Мультидисциплинарный дизайнер">Multidisciplinary Designer</div>
            <div class="lang-switch">
                <button type="button" class="lang-btn active" data-lang-set="en">EN</button>
                <span class="lang-divider">/</span>
                <button type="button" class="lang-btn" data-lang-set="ru">RU</button>
            </div>
        </div>
    </header>

    <div class="scene-container" id="sceneContainer">
        <div class="carousel-3d" id="carousel">
            
            <div class="carousel-item" data-width="560" data-height="448" data-offset-y="-15">
                <img src="./work1.jpg" alt="Bazhenova Irina - Work 1">
            </div>

            <div class="carousel-item" data-width="440" data-height="620" data-offset-y="25">
                <img src="./work2.jpg" alt="Bazhenova Irina - Work 2">
            </div>

            <div class="carousel-item transparent-png" data-width="480" data-height="600" data-offset-y="-5">
                <img src="./work3.png" alt="Bazhenova Irina - Work 3">
            </div>

            <div class="carousel-item" data-width="440" data-height="620" data-offset-y="-25">
                <img src="./work5.jpg" alt="Bazhenova Irina - Work 5">
            </div>

            <div class="carousel-item" data-width="560" data-height="420" data-offset-y="10">
                <img src="./work6.jpg" alt="Bazhenova Irina - Work 6">
            </div>

            <div class="carousel-item" data-width="440" data-height="620" data-offset-y="-15">
                <img src="./work7.jpg" alt="Bazhenova Irina - Work 7">
            </div>

            <div class="carousel-item" data-width="560" data-height="316" data-offset-y="20">
                <img src="./work8.jpg" alt="Bazhenova Irina - Work 8">
            </div>

            <div class="carousel-item transparent-png" data-width="600" data-height="450" data-offset-y="5">
                <img src="./work9.png" alt="Bazhenova Irina - Work 9">
            </div>

            <div class="carousel-item" data-width="460" data-height="640" data-offset-y="15">
                <img src="./work10.jpg" alt="Bazhenova Irina - Work 10">
            </div>

            <div class="carousel-item" data-width="560" data-height="316" data-offset-y="-20">
                <img src="./work11.jpg" alt="Bazhenova Irina - Work 11">
            </div>

            <div class="carousel-item" data-width="440" data-height="620" data-offset-y="25">
                <img src="./work12.jpg" alt="Bazhenova Irina - Work 12">
            </div>

            <div class="carousel-item" data-width="440" data-height="620" data-offset-y="-5">
                <img src="./work13.jpg" alt="Bazhenova Irina - Work 13">
            </div>

        </div>

        <div class="drag-instruction lang" id="dragLabel" data-en="Drag to spin" data-ru="Потяните, чтобы крутить">Drag to spin</div>
    </div>

    <footer>
        <a href="works.html" class="footer-link lang" data-en="Works / Visual Artifacts" data-ru="Работы / Визуальные артефакты">Works / Visual Artifacts</a>
        <a href="Bazhenova_Irina_CV.pdf?v=2" target="_blank" class="footer-link lang" data-en="CV" data-ru="Резюме">CV</a>
    </footer>

    <script>
        // --- ПЕРЕКЛЮЧЕНИЕ ЯЗЫКА ---
        const langButtons = document.querySelectorAll('[data-lang-set]');
        const translatableElements = document.querySelectorAll('.lang');

        function updateLanguage(lang) {
            translatableElements.forEach(el => {
                const text = el.getAttribute(`data-${lang}`);
                if (text) el.textContent = text;
            });

            langButtons.forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang-set') === lang);
            });

            localStorage.setItem('selected_language', lang);
            document.documentElement.lang = lang;
        }

        langButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                const targetLang = btn.getAttribute('data-lang-set');
                updateLanguage(targetLang);
            });
        });

        const initialLang = localStorage.getItem('selected_language') || 'en';
        updateLanguage(initialLang);

        // --- 3D КАРУСЕЛЬ ---
        const carousel = document.getElementById('carousel');
        const container = document.getElementById('sceneContainer');
        const items = document.querySelectorAll('.carousel-item');
        const dragLabel = document.getElementById('dragLabel');

        const totalItems = items.length;
        let radius = 580;
        
        let currentRotation = 0;
        let targetRotation = 0;
        let autoRotateSpeed = -0.08;
        let isDragging = false;
        let startX = 0;
        let startRotation = 0;
        let lastX = 0;
        let velocityX = 0;

        function layoutCarousel() {
            const screenWidth = window.innerWidth;
            let scaleFactor = 1;
            
            if (screenWidth <= 768) {
                scaleFactor = 0.28;
                radius = Math.max(520, screenWidth * 1.35);
            } else if (screenWidth <= 1200) {
                scaleFactor = 0.425;
                radius = Math.max(450, screenWidth * 0.44);
            } else {
                scaleFactor = 0.5;
                radius = 580;
            }

            items.forEach((item, index) => {
                const w = parseInt(item.getAttribute('data-width'));
                const h = parseInt(item.getAttribute('data-height'));
                const offsetY = parseFloat(item.getAttribute('data-offset-y')) || 0;

                item.style.width = (w * scaleFactor) + 'px';
                item.style.height = (h * scaleFactor) + 'px';

                const angle = (360 / totalItems) * index;

                item.style.marginLeft = -(w * scaleFactor / 2) + 'px';
                item.style.marginTop = -(h * scaleFactor / 2) + 'px';

                item.style.transform = `rotateY(${angle}deg) translateZ(${radius}px) translateY(${offsetY * scaleFactor}px)`;
            });

            if (dragLabel) {
                dragLabel.style.transform = `translateY(${230 * scaleFactor * 2}px)`;
            }
        }

        function animate() {
            if (!isDragging) {
                currentRotation += (targetRotation - currentRotation) * 0.08;
                targetRotation += autoRotateSpeed;
            } else {
                currentRotation += (targetRotation - currentRotation) * 0.2;
            }

            carousel.style.transform = `rotateY(${currentRotation}deg)`;
            requestAnimationFrame(animate);
        }

        function dragStart(x) {
            isDragging = true;
            startX = x;
            startRotation = targetRotation;
            lastX = x;
            velocityX = 0;
            if (dragLabel) dragLabel.style.opacity = '0';
        }

        function dragMove(x) {
            if (!isDragging) return;
            const deltaX = x - startX;
            const sensitivity = 0.22;
            targetRotation = startRotation + deltaX * sensitivity;

            velocityX = x - lastX;
            lastX = x;
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            targetRotation += velocityX * 0.8;
        }

        container.addEventListener('mousedown', (e) => dragStart(e.clientX));
        window.addEventListener('mousemove', (e) => dragMove(e.clientX));
        window.addEventListener('mouseup', () => dragEnd());

        container.addEventListener('touchstart', (e) => dragStart(e.touches[0].clientX));
        window.addEventListener('touchmove', (e) => dragMove(e.touches[0].clientX));
        window.addEventListener('touchend', () => dragEnd());

        container.addEventListener('mouseenter', () => {
            autoRotateSpeed = -0.015;
        });
        container.addEventListener('mouseleave', () => {
            autoRotateSpeed = -0.08;
            isDragging = false;
        });

        window.addEventListener('resize', layoutCarousel);
        layoutCarousel();
        animate();
    </script>
</body>
</html>
